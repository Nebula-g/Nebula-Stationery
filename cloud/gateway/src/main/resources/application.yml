server:
  port: 8090

spring:
  application:
    name: gateway
  config:
    # 和四个服务共用同一份 jwt.secret，否则网关放行的令牌下游验不过
    import: optional:file:./cloud-config.yml,optional:file:../cloud-config.yml
  cloud:
    gateway:
      # 前端跨域：开发环境允许 5173 / 5175 两个 Vite 端口
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5175,http://127.0.0.1:5175"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**,/api/users/**
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**,/api/categories/**,/api/admin/products/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**,/api/admin/orders/**
        - id: review-service
          uri: lb://review-service
          predicates:
            - Path=/api/reviews/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

jwt:
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.netflix.discovery: warn
