server:
  port: 8084

spring:
  application:
    name: review-service
  config:
    import: optional:file:./cloud-config.yml,optional:file:../cloud-config.yml
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nebula-store?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

feign:
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 5000

jwt:
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.netflix.discovery: warn
